services:
  postgres:
    image: postgres:17-alpine
    container_name: apartment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_secret}
      POSTGRES_DB: ${POSTGRES_DB:-apartment_db}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-apartment_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - /migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-dev_only_secret}@postgres:5432/${POSTGRES_DB:-apartment_db}?sslmode=disable

volumes:
  pg_data: